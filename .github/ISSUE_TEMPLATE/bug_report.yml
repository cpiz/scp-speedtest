name: Bug report
description: Report a reproducible problem with scp-speedtest.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid including secrets, private keys, or sensitive hostnames.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the command you ran. Redact sensitive hostnames or paths if needed.
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste relevant output or error text.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `./scp-speedtest.sh --version`, or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: ssh
    attributes:
      label: SSH/SCP details
      description: OpenSSH version, whether `--legacy-scp` was used, and any relevant SSH config behavior.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
