name: Feature request
description: Suggest an improvement for scp-speedtest.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or alternative designs you considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility notes
      description: Any concerns for macOS, Linux, OpenSSH versions, legacy scp, or JSON output compatibility.
